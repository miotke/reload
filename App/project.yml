name: ForeverAddons
options:
  bundleIdPrefix: com.andrewmiotke
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "27.0"
packages:
  AddonKit:
    path: ..
targets:
  ForeverAddons:
    type: application
    platform: macOS
    sources:
      - path: ForeverAddons
    dependencies:
      - package: AddonKit
        product: AddonKit
    info:
      path: ForeverAddons/Info.plist
      properties:
        CFBundleDisplayName: ForeverAddons
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "© 2026 Andrew Miotke"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewmiotke.ForeverAddons
        PRODUCT_NAME: ForeverAddons
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
schemes:
  ForeverAddons:
    build:
      targets:
        ForeverAddons: all
    run:
      config: Debug
    archive:
      config: Release
