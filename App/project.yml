name: ForeverAddons
options:
  bundleIdPrefix: com.andrewmiotke
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "27.0"
packages:
  AddonKit:
    path: ..
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser.git
    exactVersion: 1.5.0
targets:
  ForeverAddons:
    type: application
    platform: macOS
    sources:
      - path: ForeverAddons
    dependencies:
      - package: AddonKit
        product: AddonKit
      # The CLI ships inside the app (docs/app/project.md) and is signed with it.
      - target: addonctl
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: ForeverAddons/Info.plist
      properties:
        CFBundleDisplayName: ForeverAddons
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "© 2026 Andrew Miotke"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewmiotke.ForeverAddons
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: ForeverAddons
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  addonctl:
    type: tool
    platform: macOS
    sources:
      # Globbed: every file in the package's CLI target.
      - path: ../Sources/addonctl
    dependencies:
      - package: AddonKit
        product: AddonKit
      - package: swift-argument-parser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: addonctl
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewmiotke.ForeverAddons.addonctl
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
        # Matches the package target: nonisolated by default, not MainActor.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        # The entry point is an `@main` type (SwiftPM infers this flag; Xcode doesn't).
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
  # Not hosted: compiles the testable app sources directly, so tests never launch the app
  # (which would use the real AddonManager).
  ForeverAddonsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ForeverAddonsTests
      - path: ForeverAddons/Support/CLIInstaller.swift
      - path: ForeverAddons/Support/DirectoryWatcher.swift
      - path: ForeverAddons/Support/AddonFormatting.swift
      - path: ForeverAddons/Support/TableSorting.swift
      - path: ForeverAddons/Support/TableRows.swift
      - path: ForeverAddons/Support/UnmanagedSupport.swift
      - path: ForeverAddons/Support/MarkdownBlocks.swift
      - path: ForeverAddons/Support/AppSupport.swift
      - path: ForeverAddons/Support/AppEnvironment.swift
      - path: ForeverAddons/Support/ScreenshotLoader.swift
      - path: ForeverAddons/Models/InstallationModel.swift
    dependencies:
      - package: AddonKit
        product: AddonKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewmiotke.ForeverAddonsTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
schemes:
  ForeverAddons:
    build:
      targets:
        ForeverAddons: all
    test:
      targets:
        - ForeverAddonsTests
    run:
      config: Debug
    archive:
      config: Release
