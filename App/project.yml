name: Reload
options:
  bundleIdPrefix: com.andrewmiotke
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "27.0"
packages:
  AddonKit:
    path: ..
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser.git
    exactVersion: 1.5.0
targets:
  Reload:
    type: application
    platform: macOS
    sources:
      - path: Reload
    dependencies:
      - package: AddonKit
        product: AddonKit
      # The CLI ships inside the app (docs/app/project.md) and is signed with it.
      - target: reload-cli
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: Reload/Info.plist
      properties:
        CFBundleDisplayName: Reload
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "2"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "© 2026 Andrew Miotke. MIT License. Not affiliated with Blizzard Entertainment."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewmiotke.Reload
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Reload
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  # Named apart from the app: `Reload` and `reload` would share a build folder on a
  # case-insensitive disk. The product is still `reload`.
  reload-cli:
    type: tool
    platform: macOS
    sources:
      # Globbed: every file in the package's CLI target.
      - path: ../Sources/reload
    dependencies:
      - package: AddonKit
        product: AddonKit
      - package: swift-argument-parser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: reload
        PRODUCT_MODULE_NAME: ReloadCLITool
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewmiotke.Reload.cli
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
        # Matches the package target: nonisolated by default, not MainActor.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        # The entry point is an `@main` type (SwiftPM infers this flag; Xcode doesn't).
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
  # Not hosted: compiles the app sources (all but the `@main` entry point) into the bundle,
  # so tests never launch the app (which would use the real AddonManager), and
  # SnapshotTests can render its views over test-only data.
  ReloadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ReloadTests
      - path: Reload
        excludes:
          - ReloadApp.swift
          - Info.plist
          - Assets.xcassets
    dependencies:
      - package: AddonKit
        product: AddonKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewmiotke.ReloadTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
schemes:
  Reload:
    build:
      targets:
        Reload: all
    test:
      targets:
        - ReloadTests
    run:
      config: Debug
    archive:
      config: Release
