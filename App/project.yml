name: Reload
options:
  bundleIdPrefix: io.github.miotke
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Apple silicon only (decision 0028). Without this, macOS 26 builds would include Intel.
    ARCHS: arm64
packages:
  AddonKit:
    path: ..
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser.git
    exactVersion: 1.5.0
  # Reload's own updates (docs/app/updates.md, decision 0030). App target only; the CLI
  # updates with the app it ships in. Bump with SPARKLE_VERSION in scripts/sparkle-tools.sh.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Reload:
    type: application
    platform: macOS
    sources:
      - path: Reload
    dependencies:
      - package: AddonKit
        product: AddonKit
      - package: Sparkle
        product: Sparkle
      # The CLI ships inside the app (docs/app/project.md) and is signed with it.
      - target: reload-cli
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: Reload/Info.plist
      properties:
        CFBundleDisplayName: Reload
        CFBundleShortVersionString: "0.1.7"
        CFBundleVersion: "8"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "© 2026 miotke. MIT License. Not affiliated with Blizzard Entertainment."
        # Sparkle (docs/app/updates.md). The feed is a release asset behind GitHub's quota-free
        # latest-release redirect; it and each zip are EdDSA-signed by the release workflow.
        SUFeedURL: https://github.com/miotke/reload/releases/latest/download/appcast.xml
        SUPublicEDKey: siovTTQwjUD6i5C2ODXdb5RZfesXe/HP/VC63/cwnsw=
        SURequireSignedFeed: true
        # Sparkle requires this with a signed feed: the zip's signature is checked before unzipping.
        SUVerifyUpdateBeforeExtraction: true
        # Settings has the switch, so no "check automatically?" prompt on the second launch.
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.miotke.Reload
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Reload
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Ad-hoc signatures have no team ID, so the hardened runtime's library validation
        # rejects the embedded Sparkle.framework and the app won't launch (decision 0030).
        CODE_SIGN_ENTITLEMENTS: Reload/Reload.entitlements
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  # Named apart from the app: `Reload` and `reload` would share a build folder on a
  # case-insensitive disk. The product is still `reload`.
  reload-cli:
    type: tool
    platform: macOS
    sources:
      # Globbed: every file in the package's CLI target.
      - path: ../Sources/reload
    dependencies:
      - package: AddonKit
        product: AddonKit
      - package: swift-argument-parser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: reload
        PRODUCT_MODULE_NAME: ReloadCLITool
        PRODUCT_BUNDLE_IDENTIFIER: io.github.miotke.Reload.cli
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
        # Matches the package target: nonisolated by default, not MainActor.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        # The entry point is an `@main` type (SwiftPM infers this flag; Xcode doesn't).
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
  # Not hosted: compiles the app sources (all but the `@main` entry point) into the bundle,
  # so tests never launch the app (which would use the real AddonManager), and
  # SnapshotTests can render its views over test-only data.
  ReloadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ReloadTests
      - path: Reload
        excludes:
          - ReloadApp.swift
          - Support/SparkleUpdater.swift
          - Info.plist
          - Reload.entitlements
          - Assets.xcassets
    dependencies:
      - package: AddonKit
        product: AddonKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.miotke.ReloadTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  # Drives the built app (docs/development.md#ui-tests). Its own scheme, so CI (which tests
  # the Reload scheme) never runs it; scripts/ui-tests.sh runs it before each push.
  ReloadUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ReloadUITests
    dependencies:
      - target: Reload
      - package: AddonKit
        product: AddonKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.miotke.ReloadUITests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        TEST_TARGET_NAME: Reload
schemes:
  ReloadUITests:
    build:
      targets:
        Reload: all
        ReloadUITests: [test]
    test:
      targets:
        - ReloadUITests
  Reload:
    build:
      targets:
        Reload: all
    test:
      targets:
        - ReloadTests
    run:
      config: Debug
    archive:
      config: Release
