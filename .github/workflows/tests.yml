# Every push, on every branch: the docs check, the core and CLI tests, and the app's tests,
# each only when the push changed something it covers (docs/development.md#continuous-integration).
# The steps live in scripts/ci/. Nothing touches the network or a real WoW folder.
name: Tests

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides what the push needs on a cheap Linux runner. `test` must always report, since
  # it's a required check for main: a skipped job counts as passed, a workflow that never
  # ran (a `paths:` filter) would leave the check pending forever.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: scripts/ci/changed-areas.sh

  test:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Timing budgets ×3 on shared runners.
      RELOAD_PERF_SLACK: "3"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh
      - name: Docs check
        run: scripts/ci/test.sh docs
      - name: Core and CLI tests
        if: needs.changes.outputs.code == 'true'
        run: scripts/ci/test.sh core
      - name: App tests
        if: needs.changes.outputs.code == 'true'
        run: scripts/ci/test.sh app
