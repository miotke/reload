# Pushing a tag like v0.2.0 tests, builds and drafts a GitHub release with the app's DMG and zip
# (docs/app/releases.md). Signing and notarization run only when the secrets exist;
# without them the release is an unsigned build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.2.0 (no release is created)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      HAS_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      # The deployment target is macOS 27, so the build needs the Xcode 27 SDK.
      - name: Select Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z $xcode ]]; then
            echo "::error::This runner has no Xcode 27. Installed: $(ls -d /Applications/Xcode*.app | xargs)"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Test
        run: swift test

      - name: Import the Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)
          rm "$RUNNER_TEMP/cert.p12"
          echo "RELOAD_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "RELOAD_TEAM_ID=${{ secrets.TEAM_ID }}" >> "$GITHUB_ENV"

      - name: Prepare the notarization key
        if: env.HAS_NOTARY == 'true' && env.HAS_CERT == 'true'
        env:
          P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$P8" > "$RUNNER_TEMP/notary.p8"
          echo "RELOAD_NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          echo "RELOAD_NOTARY_KEY_ID=${{ secrets.NOTARY_KEY_ID }}" >> "$GITHUB_ENV"
          echo "RELOAD_NOTARY_ISSUER_ID=${{ secrets.NOTARY_ISSUER_ID }}" >> "$GITHUB_ENV"

      - name: Build
        run: scripts/release.sh "$VERSION"

      - name: Draft the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Unsigned build: the first time, open Reload, then click Open Anyway in System Settings ▸ Privacy & Security."
          [[ $HAS_CERT == true && $HAS_NOTARY == true ]] && notes="Signed and notarized."
          gh release create "$GITHUB_REF_NAME" build/release/Reload-*.dmg* build/release/Reload-*.zip* \
            --draft --title "Reload ${VERSION#v}" --generate-notes --notes "$notes"

      - name: Keep the build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Reload-${{ env.VERSION }}
          path: |
            build/release/Reload-*.dmg*
            build/release/Reload-*.zip*

      - name: Clean up signing files
        if: always()
        run: |
          [[ -n ${RELOAD_KEYCHAIN:-} ]] && security delete-keychain "$RELOAD_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8"
