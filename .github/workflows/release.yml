# Merging a release/vX.Y.Z pull request into main is the release (docs/app/releases.md):
# the merge's push to main tests and builds the merge commit, tags it vX.Y.Z and publishes
# the release with the PR description as its notes. Pushing a v* tag by hand still builds a
# draft release, the fallback when a merged run fails. Signing and notarization run only
# when the secrets exist; without them the release is an unsigned build. Publishing also
# needs the Sparkle key (SPARKLE_ED_PRIVATE_KEY, a `release` environment secret) for the
# update feed. The steps live in scripts/ci/.
#
# It runs on the push, not on the PR closing: that run's ref is main, which the `release`
# environment allows (a PR run's is refs/pull/N/merge), and it uses the workflow as merged,
# so no pull request can change the code that sees the key.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.2.0 (no release is created)"
        required: true

permissions:
  contents: write
  # The publish step reads the release PR's description for the notes.
  pull-requests: read

jobs:
  # A push to main releases only when it's the merge commit of a release/vX.Y.Z PR from this
  # repo. Every other push stops here, before the macOS runner or the environment.
  find-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
    steps:
      - uses: actions/checkout@v4
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: scripts/ci/find-release-pr.sh

  release:
    needs: find-release
    # find-release is skipped for tags and manual runs, so `always()` keeps this job; it then
    # runs for those, and for a push to main only when find-release named a release PR.
    if: >-
      always() && needs.find-release.result != 'failure' && needs.find-release.result != 'cancelled' && (
        github.event_name != 'push' || github.ref_type == 'tag' || needs.find-release.outputs.head_ref != '')
    runs-on: macos-26
    # The Sparkle key lives in the `release` environment, which only deploys to main and v*
    # tags, so a workflow run from any other branch can't read it. Manual test builds don't
    # need it and run without the environment (docs/app/updates.md#signing-key).
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    env:
      HAS_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
      # Timing budgets ×3 on shared runners, as in tests.yml.
      RELOAD_PERF_SLACK: "3"
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        env:
          HEAD_REF: ${{ needs.find-release.outputs.head_ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: scripts/ci/release-version.sh

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      # The same checks as tests.yml, on the merge commit itself. Any failure stops the job
      # here: nothing is built, tagged or published.
      - name: Docs check
        run: scripts/ci/test.sh docs
      - name: Core and CLI tests
        run: scripts/ci/test.sh core
      - name: App tests
        run: scripts/ci/test.sh app

      - name: Import the Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: scripts/ci/import-certificate.sh

      - name: Prepare the notarization key
        if: env.HAS_NOTARY == 'true' && env.HAS_CERT == 'true'
        env:
          P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/ci/notary-key.sh

      - name: Build
        run: scripts/release.sh "$VERSION"

      - name: Tag and publish the release
        if: needs.find-release.outputs.head_ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          PR_NUMBER: ${{ needs.find-release.outputs.number }}
          HEAD_REF: ${{ needs.find-release.outputs.head_ref }}
        run: scripts/ci/publish-release.sh

      - name: Draft the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/ci/draft-release.sh

      - name: Keep the build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Reload-${{ env.VERSION }}
          path: |
            build/release/Reload-*.dmg*
            build/release/Reload-*.zip*

      - name: Clean up signing files
        if: always()
        run: scripts/ci/cleanup-signing.sh
