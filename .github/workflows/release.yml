# Merging a release/vX.Y.Z pull request into main is the release (docs/app/releases.md):
# this tests and builds the merge commit, tags it vX.Y.Z and publishes the release with the
# PR description as its notes. Pushing a v* tag by hand still builds a draft release, the
# fallback when a merged run fails. Signing and notarization run only when the secrets
# exist; without them the release is an unsigned build. The steps live in scripts/ci/.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.2.0 (no release is created)"
        required: true

permissions:
  contents: write

jobs:
  release:
    # A closed PR only releases when it's a merged release branch from this repo.
    if: >-
      github.event_name != 'pull_request' || (
        github.event.pull_request.merged &&
        startsWith(github.event.pull_request.head.ref, 'release/v') &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-26
    env:
      HAS_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
      # Timing budgets ×3 on shared runners, as in tests.yml.
      RELOAD_PERF_SLACK: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Work out the version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: scripts/ci/release-version.sh

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      # The same checks as tests.yml, on the merge commit itself. Any failure stops the job
      # here: nothing is built, tagged or published.
      - name: Docs check
        run: scripts/ci/test.sh docs
      - name: Core and CLI tests
        run: scripts/ci/test.sh core
      - name: App tests
        run: scripts/ci/test.sh app

      - name: Import the Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: scripts/ci/import-certificate.sh

      - name: Prepare the notarization key
        if: env.HAS_NOTARY == 'true' && env.HAS_CERT == 'true'
        env:
          P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/ci/notary-key.sh

      - name: Build
        run: scripts/release.sh "$VERSION"

      - name: Tag and publish the release
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: scripts/ci/publish-release.sh

      - name: Draft the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/draft-release.sh

      - name: Keep the build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Reload-${{ env.VERSION }}
          path: |
            build/release/Reload-*.dmg*
            build/release/Reload-*.zip*

      - name: Clean up signing files
        if: always()
        run: scripts/ci/cleanup-signing.sh
